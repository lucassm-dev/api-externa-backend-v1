# spec-28: sem o cache de resultado por sessão do H2, que devolvia a consulta antiga (vazia) depois de
# um INSERT feito por outra thread — o registro de uso é gravado de forma assíncrona
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;QUERY_CACHE_SIZE=0
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

jwt.secret=teste-segredo-fixo-para-testes-automatizados-nao-usar-em-producao-1234567890

# CORS — origem de desenvolvimento; testes que precisam de outra sobrescrevem via @SpringBootTest(properties=...)
cors.allowed-origins=http://localhost:4200
