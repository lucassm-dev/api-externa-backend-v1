spring.application.name=api-externa-backend
spring.profiles.active=dev

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# AC-549: documentação só existe no perfil dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# spec-16: primeiro ADMIN via ADMIN_EMAIL / ADMIN_SENHA (admin.email / admin.senha), sem valor padrão
jwt.issuer=${JWT_ISSUER:api-externa-backend}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

cotacao.cache-ttl-minutos=15
cambio.cache-ttl-minutos=15
mercado.barra-cache-ttl-minutos=30

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:}

# ADR-017: o limite de 2 MB da foto é checado no código (AUT-016); o teto do multipart fica acima dele
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
