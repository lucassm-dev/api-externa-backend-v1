spring.application.name=api-externa-backend
spring.profiles.active=dev

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# AC-549: documentação só existe no perfil dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.issuer=${JWT_ISSUER:api-externa-backend}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

cotacao.cache-ttl-minutos=15
cambio.cache-ttl-minutos=15
mercado.barra-cache-ttl-minutos=30
