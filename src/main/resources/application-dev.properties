spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Chaves de API externas vêm do .env (carregado pelo spring-dotenv), nunca deste
# arquivo: ele é rastreado pelo git. Ver .env.example para os nomes esperados.

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS — origens do frontend autorizadas a chamar a API (SPEC-11)
cors.allowed-origins=http://localhost:4200
